name: CI/CD Churn API

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - staging

jobs:
  retrain_model:
    runs-on: ubuntu-latest
    container: docker://dvcorg/cml:latest
    env:
      repo_token: ${{ secrets.GITHUBTOKEN }}
    steps:
      - uses: actions/checkout@v2

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Execute training script
        run: python3 src/train_model.py

  build_and_deploy:
    needs: retrain_model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/churn-api:dev .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/churn-api:dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker login -u '${{ secrets.DOCKER_USERNAME }}' -p '${{ secrets.DOCKER_PASSWORD }}'
            if docker ps -a --format '{{.Names}}' | grep -Eq '^churn-api$'; then
              docker stop churn-api
              docker rm churn-api
            fi
            docker pull ${{ secrets.DOCKER_USERNAME }}/churn-api:dev
            docker run -d --name churn-api -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/churn-api:dev